# OPTIONAL. Only if iwd is your Wi-Fi client manager: keep it away from the USB adapter that runs the
# car access point (iwd would otherwise grab it as a station and fight hostapd). See docs/wifi.md.
[Service]
EnvironmentFile=-/etc/beagle-aa-bridge/env
ExecStart=
ExecStart=/usr/local/sbin/aa-iwd.sh
